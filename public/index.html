<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Shopping List</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell" data-auth="loading">
      <section class="pin-panel" aria-labelledby="pin-title">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <h1 id="pin-title">Shopping List</h1>
        <p>Enter the shared PIN to open your list.</p>
        <form id="pin-form" class="pin-form">
          <label for="pin-input">PIN</label>
          <div class="pin-row">
            <input id="pin-input" name="pin" inputmode="numeric" autocomplete="current-password" type="password" required>
            <button type="submit">Unlock</button>
          </div>
          <p id="pin-error" class="form-error" role="alert"></p>
          <p id="pin-warning" class="warning" hidden>Default development PIN is active.</p>
        </form>
      </section>

      <section class="shopping-app" aria-label="Shopping list">
        <header class="app-header">
          <div>
            <p class="eyebrow">Shared</p>
            <h1>Shopping List</h1>
          </div>
          <button id="logout-button" class="ghost-button" type="button">Lock</button>
        </header>

        <section class="content">
          <form id="todo-form" class="composer">
            <label for="todo-title">Add item</label>
            <div class="add-row">
              <input id="todo-title" name="title" type="text" placeholder="Add an item" maxlength="180" autocomplete="off" required>
              <button type="submit">Add</button>
            </div>
            <div id="suggestions" class="suggestions" aria-label="Suggestions"></div>
          </form>

          <section class="list-section" aria-labelledby="needed-title">
            <div class="section-heading">
              <h2 id="needed-title">Need</h2>
              <span id="needed-count">0</span>
            </div>
            <div id="empty-needed" class="empty-state" hidden>
              <h3>Nothing on the list</h3>
              <p>Add an item above.</p>
            </div>
            <ul id="needed-list" class="todo-list" aria-live="polite"></ul>
          </section>

          <section class="list-section" aria-labelledby="completed-title">
            <div class="section-heading">
              <h2 id="completed-title">Picked up</h2>
              <span id="completed-count">0</span>
            </div>
            <div id="empty-completed" class="empty-state compact" hidden>
              <p>Checked items stay here.</p>
            </div>
            <ul id="completed-list" class="todo-list completed-list" aria-live="polite"></ul>
          </section>
        </section>
      </section>
    </main>

    <template id="todo-template">
      <li class="todo-item">
        <label class="complete-control">
          <input class="complete-input" type="checkbox">
          <span></span>
        </label>
        <input class="title-input" maxlength="180" aria-label="Item name">
        <button class="delete-button" type="button" aria-label="Delete item">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M6 6l1 15h10l1-15"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        </button>
      </li>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
